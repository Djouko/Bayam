# Plateforme locale FluxStore : WordPress + WooCommerce + WCFM (place de marché) + MStore API.
# Démarrer : docker compose up -d   puis, la première fois : docker compose run --rm cli bash /scripts/installer.sh
# Site et administration : http://localhost:8080  (identifiants dans le fichier .env)
name: fluxstore-local

services:
  db:
    image: mariadb:11.4.9
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  # Redis : cache d'objets persistant de WordPress et signal de réveil du travailleur à chaque événement WhatsApp.
  # Données reconstituables (la base reste la référence) : pas d'écriture sur disque, éviction des clés anciennes.
  redis:
    image: redis:8.2.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]

  wordpress:
    # Image officielle + extension PHP Redis (images/wordpress/Dockerfile).
    image: bayam/wordpress:7.0.4-redis
    build: images/wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # Les appels de l'application passent par http://localhost:8080 ; on autorise l'en-tête d'autorisation de l'API REST.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PREFIX', 'bayam:');
      # Connecteur WhatsApp (WAHA) : appelé par l'extension BAYAM WhatsApp.
      WAHA_URL: http://waha:3000
      BAYAM_TUNNEL_METRICS: http://tunnel:2000
      BAYAM_REDIS: redis
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD:-}
      CINETPAY_ENV: ${CINETPAY_ENV:-sandbox}
      # Assistant du vendeur (API Anthropic) : sans clé, il reste inactif.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BAYAM_ASSISTANT_MODELE: ${BAYAM_ASSISTANT_MODELE:-claude-opus-5-5}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET}
    volumes:
      - wp:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/fluxstore.ini:ro
      # Code BAYAM suivi ici : charte des pages vendeur (mu-plugins) et extension WhatsApp.
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./plugins/bayam-whatsapp:/var/www/html/wp-content/plugins/bayam-whatsapp
      - whatsapp-vendor:/var/www/html/wp-content/plugins/bayam-whatsapp/vendor
      - ./plugins/bayam-cinetpay:/var/www/html/wp-content/plugins/bayam-cinetpay
      - ./themes/bayam-vitrine:/var/www/html/wp-content/themes/bayam-vitrine

  # WhatsApp en mode connecté (appareil lié par QR code), connecteur libre WAHA, moteur GOWS sans navigateur.
  waha:
    image: devlikeapro/waha:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      # Tableau de bord WAHA (http://127.0.0.1:3000/dashboard) : identifiants fixes, sinon régénérés à chaque démarrage.
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      TZ: Africa/Douala
    volumes:
      - waha:/app/.sessions

  # Adresse publique temporaire (https://….trycloudflare.com) pour ouvrir le site local depuis un téléphone pendant
  # les démonstrations. Elle change à chaque redémarrage : WordPress la lit sur /quicktunnel (mu-plugin bayam-adresses).
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://wordpress:80
    depends_on:
      - wordpress

  # Travailleur BAYAM : traite les messages WhatsApp en moins d'une seconde et les tâches programmées
  # (publications étalées, rapports), indépendamment des visites du site.
  travailleur:
    image: bayam/wp-cli:2.12.0-redis
    build: images/wp-cli
    restart: unless-stopped
    user: "33:33"
    depends_on:
      - wordpress
    command: ["wp", "bayam-wa", "travailleur", "--duree=3600"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PREFIX', 'bayam:');
      WAHA_URL: http://waha:3000
      BAYAM_TUNNEL_METRICS: http://tunnel:2000
      BAYAM_REDIS: redis
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD:-}
      CINETPAY_ENV: ${CINETPAY_ENV:-sandbox}
      # Assistant du vendeur (API Anthropic) : sans clé, il reste inactif.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BAYAM_ASSISTANT_MODELE: ${BAYAM_ASSISTANT_MODELE:-claude-opus-5-5}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET}
      TZ: Africa/Douala
    volumes:
      - wp:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./plugins/bayam-whatsapp:/var/www/html/wp-content/plugins/bayam-whatsapp
      - whatsapp-vendor:/var/www/html/wp-content/plugins/bayam-whatsapp/vendor
      - ./plugins/bayam-cinetpay:/var/www/html/wp-content/plugins/bayam-cinetpay
      - ./themes/bayam-vitrine:/var/www/html/wp-content/themes/bayam-vitrine

  # Dépendances PHP de l'extension WhatsApp (SDK Anthropic de l'assistant) : docker compose run --rm composer install
  composer:
    image: composer:2.9.2
    profiles: ["outils"]
    working_dir: /app
    environment:
      COMPOSER_PROCESS_TIMEOUT: 1800
    volumes:
      - ./plugins/bayam-whatsapp:/app
      - whatsapp-vendor:/app/vendor

  cli:
    image: bayam/wp-cli:2.12.0-redis
    profiles: ["outils"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WP_URL: http://localhost:8080
      WP_ADMIN: ${WP_ADMIN}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_VENDOR_PASSWORD: ${WP_VENDOR_PASSWORD}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PREFIX', 'bayam:');
      WAHA_URL: http://waha:3000
      BAYAM_TUNNEL_METRICS: http://tunnel:2000
      BAYAM_REDIS: redis
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD:-}
      CINETPAY_ENV: ${CINETPAY_ENV:-sandbox}
      # Assistant du vendeur (API Anthropic) : sans clé, il reste inactif.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BAYAM_ASSISTANT_MODELE: ${BAYAM_ASSISTANT_MODELE:-claude-opus-5-5}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET}
      WP_CLI_CONFIG_PATH: /scripts/wp-cli.yml
    volumes:
      - wp:/var/www/html
      - ./scripts:/scripts
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./plugins/bayam-whatsapp:/var/www/html/wp-content/plugins/bayam-whatsapp
      - whatsapp-vendor:/var/www/html/wp-content/plugins/bayam-whatsapp/vendor
      - ./plugins/bayam-cinetpay:/var/www/html/wp-content/plugins/bayam-cinetpay
      - ./themes/bayam-vitrine:/var/www/html/wp-content/themes/bayam-vitrine

volumes:
  whatsapp-vendor:
  db:
  wp:
  waha:
