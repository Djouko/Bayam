# Plateforme locale BAYAM, en migration progressive vers des microservices :
# - boutique actuelle : WordPress + WooCommerce + WCFM (place de marché) + MStore API ;
# - nouveaux services (services/, TypeScript) : passerelle des événements WhatsApp et Facebook, canal WhatsApp,
#   canal Facebook ;
# - socle : bus NATS JetStream, PostgreSQL (un schéma par service), Redis.
# Démarrer : docker compose up -d --build   puis, la première fois : docker compose run --rm cli bash /scripts/installer.sh
# Site et administration : http://localhost:8080  (identifiants dans le fichier .env)
name: fluxstore-local

services:
  db:
    image: mariadb:11.4.9
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  # Redis : cache d'objets persistant de WordPress et signal de réveil du travailleur à chaque événement WhatsApp.
  # Données reconstituables (la base reste la référence) : pas d'écriture sur disque, éviction des clés anciennes.
  redis:
    image: redis:8.2.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]

  # Entrée unique (infra/traefik) : http://localhost:8080 et le tunnel public passent ici.
  traefik:
    image: traefik:v3.6.25
    restart: unless-stopped
    ports:
      - "8080:80"
      - "127.0.0.1:8081:8081"
    volumes:
      - ./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/traefik/dynamique.yml:/etc/traefik/dynamique.yml:ro
    depends_on:
      - proxy-docker
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck"]
      interval: 10s
      retries: 6

  # Accès de Traefik à Docker limité à la lecture de la liste des conteneurs (jamais le socket complet).
  proxy-docker:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: ["no-new-privileges:true"]

  # Cache des pages publiques (infra/nginx) : visiteurs anonymes servis sans faire travailler PHP, tout ce qui est
  # personnel passe directement ; répartit aussi la charge entre les copies de WordPress.
  cache-web:
    image: nginx:1.29.8-alpine
    restart: unless-stopped
    volumes:
      - ./infra/nginx/cache.conf:/etc/nginx/conf.d/default.conf:ro
    tmpfs:
      - /var/cache/nginx
    depends_on:
      - wordpress
    security_opt: ["no-new-privileges:true"]
    labels:
      traefik.enable: "true"
      traefik.http.services.boutique.loadbalancer.server.port: "8080"
      traefik.http.services.boutique.loadbalancer.healthcheck.path: /robots.txt
      traefik.http.services.boutique.loadbalancer.healthcheck.interval: 10s
      traefik.http.services.boutique.loadbalancer.healthcheck.timeout: 5s
      # Le site ne répond qu'à son adresse (localhost:8080) et redirige le reste : le contrôle s'y présente,
      # et ne suit jamais une redirection (sinon une copie saine paraît en panne).
      traefik.http.services.boutique.loadbalancer.healthcheck.hostname: localhost:8080
      traefik.http.services.boutique.loadbalancer.healthcheck.followredirects: "false"
      traefik.http.routers.boutique.rule: PathPrefix(`/`)
      traefik.http.routers.boutique.priority: "1"
      traefik.http.routers.boutique.entrypoints: web
      traefik.http.routers.boutique.service: boutique
      traefik.http.routers.boutique.middlewares: securite@file,debit-general@file,compression@file,corps-limite@file
      traefik.http.routers.boutique-statique.rule: PathRegexp(`\.(css|js|jpe?g|png|webp|avif|gif|svg|woff2?|ico)$$`)
      traefik.http.routers.boutique-statique.priority: "40"
      traefik.http.routers.boutique-statique.entrypoints: web
      traefik.http.routers.boutique-statique.service: boutique
      traefik.http.routers.boutique-statique.middlewares: securite@file,debit-general@file,cache-statique@file,compression@file
      traefik.http.routers.boutique-sensible.rule: (Path(`/wp-login.php`) || PathPrefix(`/my-account`) || PathPrefix(`/wp-json/wc/store/v1/checkout`)) && Method(`POST`)
      traefik.http.routers.boutique-sensible.priority: "50"
      traefik.http.routers.boutique-sensible.entrypoints: web
      traefik.http.routers.boutique-sensible.service: boutique
      traefik.http.routers.boutique-sensible.middlewares: securite@file,debit-sensible@file,compression@file,corps-limite@file
      traefik.http.routers.boutique-liens.rule: PathPrefix(`/commander/`)
      traefik.http.routers.boutique-liens.priority: "50"
      traefik.http.routers.boutique-liens.entrypoints: web
      traefik.http.routers.boutique-liens.service: boutique
      traefik.http.routers.boutique-liens.middlewares: securite@file,debit-liens@file
      traefik.http.routers.boutique-interne.rule: PathPrefix(`/wp-json/bayam/v1/interne`) || PathPrefix(`/wp-json/bayam/v1/whatsapp`) || Path(`/xmlrpc.php`) || QueryRegexp(`rest_route`, `^/?bayam/`)
      traefik.http.routers.boutique-interne.priority: "100"
      traefik.http.routers.boutique-interne.entrypoints: web
      traefik.http.routers.boutique-interne.service: boutique
      traefik.http.routers.boutique-interne.middlewares: interne-seulement@file

  wordpress:
    # Image officielle + extension PHP Redis (images/wordpress/Dockerfile).
    image: bayam/wordpress:7.0.4-redis
    build: images/wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Deux copies derrière l'entrée : l'une peut redémarrer sans coupure. Sessions WooCommerce en base,
    # fichiers sur le volume partagé : aucune affinité nécessaire.
    deploy:
      replicas: 2
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      # Les appels de l'application passent par http://localhost:8080 ; on autorise l'en-tête d'autorisation de l'API REST.
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PREFIX', 'bayam:');
      # Connecteur WhatsApp (WAHA) : appelé par l'extension BAYAM WhatsApp.
      WAHA_URL: http://waha:3000
      BAYAM_TUNNEL_METRICS: http://tunnel:2000
      BAYAM_WA_WEBHOOK: http://passerelle:8090/whatsapp
      BAYAM_REDIS: redis
      # Microservices : jeton partagé de l'API interne, adresse du canal WhatsApp (liens personnels, notifications).
      BAYAM_SERVICE_JETON: ${BAYAM_SERVICE_JETON}
      BAYAM_CANAL_URL: http://canal-whatsapp:8091
      BAYAM_CANAL_FACEBOOK_URL: http://canal-facebook:8092
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD:-}
      CINETPAY_ENV: ${CINETPAY_ENV:-sandbox}
      # Cartes bancaires (Stripe) : clés de test ou de production, jamais en base.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      # Assistant du vendeur (API Anthropic) : sans clé, il reste inactif.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Sans clé Anthropic : Google Gemini (offre gratuite) pour l'assistant et le Copilote ; modèles essayés dans l'ordre.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BAYAM_GEMINI_MODELES: ${BAYAM_GEMINI_MODELES:-gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      BAYAM_ASSISTANT_MODELE: ${BAYAM_ASSISTANT_MODELE:-claude-opus-5-5}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET}
    volumes:
      - wp:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/fluxstore.ini:ro
      # Code BAYAM suivi ici : charte des pages vendeur (mu-plugins) et extension WhatsApp.
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./plugins/bayam-whatsapp:/var/www/html/wp-content/plugins/bayam-whatsapp
      - whatsapp-vendor:/var/www/html/wp-content/plugins/bayam-whatsapp/vendor
      - ./plugins/bayam-cinetpay:/var/www/html/wp-content/plugins/bayam-cinetpay
      - ./themes/bayam-vitrine:/var/www/html/wp-content/themes/bayam-vitrine


  # WhatsApp en mode connecté (appareil lié par QR code), connecteur libre WAHA, moteur GOWS sans navigateur.
  waha:
    # Version épinglée (empreinte de l'image 2026.10.1 testée) : une mise à jour se décide, elle ne s'impose pas.
    image: devlikeapro/waha:latest@sha256:2fc1787ddbd343ed2e7d59482846d1b22aa5ca134e29aa8d42d0e88c54e24779
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      # Tableau de bord WAHA (http://127.0.0.1:3000/dashboard) : identifiants fixes, sinon régénérés à chaque démarrage.
      WAHA_DASHBOARD_USERNAME: admin
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      WHATSAPP_SWAGGER_USERNAME: admin
      WHATSAPP_SWAGGER_PASSWORD: ${WAHA_DASHBOARD_PASSWORD}
      TZ: Africa/Douala
    volumes:
      - waha:/app/.sessions

  # Adresse publique temporaire (https://….trycloudflare.com) pour ouvrir le site local depuis un téléphone pendant
  # les démonstrations. Elle change à chaque redémarrage : WordPress la lit sur /quicktunnel (mu-plugin bayam-adresses).
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 --url http://traefik:80
    depends_on:
      - traefik

  # Bus d'événements : chaque événement WhatsApp est écrit sur disque avant d'être acquitté à WAHA, puis relu
  # par les services à leur rythme, avec redistribution en cas d'échec. Jamais exposé hors du réseau interne.
  nats:
    image: nats:2.12.15-alpine
    restart: unless-stopped
    command: ["--config", "/etc/nats/nats.conf"]
    volumes:
      - nats:/data
      - ./infra/nats/nats.conf:/etc/nats/nats.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8222/healthz?js-enabled-only=true"]
      interval: 5s
      retries: 30

  # Base des nouveaux services : un rôle et un schéma par service (infra/postgres/initialisation.sh).
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bayam
      POSTGRES_USER: bayam_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CANAL_WHATSAPP_DB_PASSWORD: ${CANAL_WHATSAPP_DB_PASSWORD}
      CANAL_FACEBOOK_DB_PASSWORD: ${CANAL_FACEBOOK_DB_PASSWORD}
      TZ: Africa/Douala
    volumes:
      - postgres:/var/lib/postgresql
      - ./infra/postgres/initialisation.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bayam_admin", "-d", "bayam"]
      interval: 5s
      retries: 30

  # Veilleur du tunnel de démonstration (services/src/veilleur) : le relance quand Cloudflare supprime l'adresse
  # gratuite. Sa porte vers Docker ne permet que de lister et de redémarrer des conteneurs.
  veilleur:
    image: bayam/services:1
    restart: unless-stopped
    command: ["node", "src/veilleur/index.ts"]
    environment:
      TUNNEL_CONTENEUR: fluxstore-local-tunnel-1
    depends_on:
      - proxy-docker-veilleur
      - tunnel
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  proxy-docker-veilleur:
    image: tecnativa/docker-socket-proxy@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      POST: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: ["no-new-privileges:true"]

  # Passerelle des événements WhatsApp (services/src/passerelle) : vérifie la signature de WAHA, ne garde que ce
  # qui concerne BAYAM (privé, session, commentaires sous une publication BAYAM) et l'écrit dans le bus.
  passerelle:
    image: bayam/services:1
    build: services
    restart: unless-stopped
    command: ["node", "src/passerelle/index.ts"]
    environment:
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET}
      # Facebook : secret de l'application Meta (signature des événements) et jeton de vérification de l'adresse.
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_JETON_VERIFICATION: ${FACEBOOK_JETON_VERIFICATION:-}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
    # Adresses publiques : événements Facebook (https://<adresse>/webhooks/facebook) et état des fonctions pour les
    # applications (https://<adresse>/api/config) ; /whatsapp et /sante restent sur le réseau interne. (https://<adresse>/webhooks/facebook) ; /whatsapp et
    # /sante restent sur le réseau interne.
    labels:
      traefik.enable: "true"
      traefik.http.services.passerelle.loadbalancer.server.port: "8090"
      traefik.http.middlewares.vers-facebook.replacepath.path: /facebook
      traefik.http.routers.webhook-facebook.rule: Path(`/webhooks/facebook`)
      traefik.http.routers.webhook-facebook.priority: "100"
      traefik.http.routers.webhook-facebook.entrypoints: web
      traefik.http.routers.webhook-facebook.service: passerelle
      traefik.http.routers.webhook-facebook.middlewares: securite@file,debit-general@file,corps-limite@file,vers-facebook
      traefik.http.middlewares.vers-config.replacepath.path: /config
      traefik.http.routers.config-fonctions.rule: Path(`/api/config`)
      traefik.http.routers.config-fonctions.priority: "100"
      traefik.http.routers.config-fonctions.entrypoints: web
      traefik.http.routers.config-fonctions.service: passerelle
      traefik.http.routers.config-fonctions.middlewares: securite@file,debit-general@file,compression@file,vers-config
    depends_on:
      redis:
        condition: service_started
      nats:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/sante"]
      interval: 10s
      retries: 6

  # Canal WhatsApp (services/src/canal-whatsapp) : catalogue interactif (listes, cartes produit, lien personnel de
  # commande), notifications aux clients ; transmet le reste à l'extension WordPress pendant la migration.
  canal-whatsapp:
    image: bayam/services:1
    restart: unless-stopped
    command: ["node", "src/canal-whatsapp/index.ts"]
    environment:
      CANAL_WHATSAPP_BASE: postgres://canal_whatsapp:${CANAL_WHATSAPP_DB_PASSWORD}@postgres:5432/bayam
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      WAHA_URL: http://waha:3000
      WAHA_API_KEY: ${WAHA_API_KEY}
      BAYAM_SERVICE_JETON: ${BAYAM_SERVICE_JETON}
      BAYAM_WP_INTERNE: http://wordpress
      # Adresse publique fixe (domaine) quand elle existe ; sinon celle du tunnel de démonstration, lue en direct.
      BAYAM_URL_PUBLIQUE: ${BAYAM_URL_PUBLIQUE:-}
      BAYAM_TUNNEL_METRICS: http://tunnel:2000
      TZ: Africa/Douala
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      passerelle:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8091/sante"]
      interval: 10s
      retries: 6

  # Canal Facebook (services/src/canal-facebook) : Pages des vendeurs par l'API officielle de Meta. Messenger
  # (catalogue en carrousel, lien personnel de commande), réponses aux commentaires, publications et stories,
  # connexion des Pages (https://<adresse>/facebook/connexion). Sans application Meta configurée, il attend.
  canal-facebook:
    image: bayam/services:1
    restart: unless-stopped
    command: ["node", "src/canal-facebook/index.ts"]
    environment:
      CANAL_FACEBOOK_BASE: postgres://canal_facebook:${CANAL_FACEBOOK_DB_PASSWORD}@postgres:5432/bayam
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      # Configuration de « Facebook Login for Business » (fenêtre de connexion des Pages par les vendeurs).
      FACEBOOK_CONFIG_ID: ${FACEBOOK_CONFIG_ID:-}
      # Jeton que Meta renvoie en vérifiant l'adresse des événements, déclarée par le service lui-même.
      FACEBOOK_JETON_VERIFICATION: ${FACEBOOK_JETON_VERIFICATION:-}
      # Clé de chiffrement des jetons de Page en base (32 octets en base64).
      FACEBOOK_CLE: ${FACEBOOK_CLE}
      NATS_URL: nats://nats:4222
      REDIS_URL: redis://redis:6379
      BAYAM_SERVICE_JETON: ${BAYAM_SERVICE_JETON}
      BAYAM_WP_INTERNE: http://wordpress
      BAYAM_CANAL_WHATSAPP: http://canal-whatsapp:8091
      BAYAM_URL_PUBLIQUE: ${BAYAM_URL_PUBLIQUE:-}
      BAYAM_TUNNEL_METRICS: http://tunnel:2000
      TZ: Africa/Douala
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8092/sante"]
      interval: 10s
      retries: 6
    labels:
      traefik.enable: "true"
      traefik.http.services.canal-facebook.loadbalancer.server.port: "8092"
      traefik.http.routers.facebook-connexion.rule: Path(`/facebook/connexion`) || Path(`/facebook/retour`) || Path(`/facebook/choisir`)
      traefik.http.routers.facebook-connexion.priority: "100"
      traefik.http.routers.facebook-connexion.entrypoints: web
      traefik.http.routers.facebook-connexion.service: canal-facebook
      traefik.http.routers.facebook-connexion.middlewares: securite@file,debit-liens@file

  # Travailleur BAYAM : traite les messages WhatsApp en moins d'une seconde et les tâches programmées
  # (publications étalées, rapports), indépendamment des visites du site.
  travailleur:
    image: bayam/wp-cli:2.12.0-redis
    build: images/wp-cli
    restart: unless-stopped
    user: "33:33"
    depends_on:
      - wordpress
    command: ["wp", "bayam-wa", "travailleur", "--duree=3600"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PREFIX', 'bayam:');
      WAHA_URL: http://waha:3000
      BAYAM_TUNNEL_METRICS: http://tunnel:2000
      BAYAM_WA_WEBHOOK: http://passerelle:8090/whatsapp
      BAYAM_REDIS: redis
      # Microservices : jeton partagé de l'API interne, adresse du canal WhatsApp (liens personnels, notifications).
      BAYAM_SERVICE_JETON: ${BAYAM_SERVICE_JETON}
      BAYAM_CANAL_URL: http://canal-whatsapp:8091
      BAYAM_CANAL_FACEBOOK_URL: http://canal-facebook:8092
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD:-}
      CINETPAY_ENV: ${CINETPAY_ENV:-sandbox}
      # Cartes bancaires (Stripe) : clés de test ou de production, jamais en base.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      # Assistant du vendeur (API Anthropic) : sans clé, il reste inactif.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Sans clé Anthropic : Google Gemini (offre gratuite) pour l'assistant et le Copilote ; modèles essayés dans l'ordre.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BAYAM_GEMINI_MODELES: ${BAYAM_GEMINI_MODELES:-gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      BAYAM_ASSISTANT_MODELE: ${BAYAM_ASSISTANT_MODELE:-claude-opus-5-5}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET}
      TZ: Africa/Douala
    volumes:
      - wp:/var/www/html
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./plugins/bayam-whatsapp:/var/www/html/wp-content/plugins/bayam-whatsapp
      - whatsapp-vendor:/var/www/html/wp-content/plugins/bayam-whatsapp/vendor
      - ./plugins/bayam-cinetpay:/var/www/html/wp-content/plugins/bayam-cinetpay
      - ./themes/bayam-vitrine:/var/www/html/wp-content/themes/bayam-vitrine

  # Dépendances PHP de l'extension WhatsApp (SDK Anthropic de l'assistant) : docker compose run --rm composer install
  composer:
    image: composer:2.9.2
    profiles: ["outils"]
    working_dir: /app
    environment:
      COMPOSER_PROCESS_TIMEOUT: 1800
    volumes:
      - ./plugins/bayam-whatsapp:/app
      - whatsapp-vendor:/app/vendor

  cli:
    image: bayam/wp-cli:2.12.0-redis
    profiles: ["outils"]
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WP_URL: http://localhost:8080
      WP_ADMIN: ${WP_ADMIN}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_VENDOR_PASSWORD: ${WP_VENDOR_PASSWORD}
      WP_CLI_CACHE_DIR: /tmp/wp-cli-cache
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_REDIS_HOST', 'redis');
        define('WP_REDIS_PREFIX', 'bayam:');
      WAHA_URL: http://waha:3000
      BAYAM_TUNNEL_METRICS: http://tunnel:2000
      BAYAM_WA_WEBHOOK: http://passerelle:8090/whatsapp
      BAYAM_REDIS: redis
      # Microservices : jeton partagé de l'API interne, adresse du canal WhatsApp (liens personnels, notifications).
      BAYAM_SERVICE_JETON: ${BAYAM_SERVICE_JETON}
      BAYAM_CANAL_URL: http://canal-whatsapp:8091
      BAYAM_CANAL_FACEBOOK_URL: http://canal-facebook:8092
      CINETPAY_API_KEY: ${CINETPAY_API_KEY:-}
      CINETPAY_API_PASSWORD: ${CINETPAY_API_PASSWORD:-}
      CINETPAY_ENV: ${CINETPAY_ENV:-sandbox}
      # Cartes bancaires (Stripe) : clés de test ou de production, jamais en base.
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_MODE: ${STRIPE_MODE:-test}
      # Assistant du vendeur (API Anthropic) : sans clé, il reste inactif.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Sans clé Anthropic : Google Gemini (offre gratuite) pour l'assistant et le Copilote ; modèles essayés dans l'ordre.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BAYAM_GEMINI_MODELES: ${BAYAM_GEMINI_MODELES:-gemini-3.6-flash,gemini-3.5-flash-lite,gemini-3.1-flash-lite}
      BAYAM_ASSISTANT_MODELE: ${BAYAM_ASSISTANT_MODELE:-claude-opus-5-5}
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET}
      WP_CLI_CONFIG_PATH: /scripts/wp-cli.yml
    volumes:
      - wp:/var/www/html
      - ./scripts:/scripts
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./plugins/bayam-whatsapp:/var/www/html/wp-content/plugins/bayam-whatsapp
      - whatsapp-vendor:/var/www/html/wp-content/plugins/bayam-whatsapp/vendor
      - ./plugins/bayam-cinetpay:/var/www/html/wp-content/plugins/bayam-cinetpay
      - ./themes/bayam-vitrine:/var/www/html/wp-content/themes/bayam-vitrine

volumes:
  whatsapp-vendor:
  nats:
  postgres:
  db:
  wp:
  waha:
