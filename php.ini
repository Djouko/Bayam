; Réglages PHP pour l'import des produits de démonstration et les images.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 512M
max_execution_time = 300

; Cache du code PHP dimensionné pour WooCommerce + WCFM (plus de 10 000 fichiers) ; les fichiers ne sont revérifiés
; que toutes les 60 s : chaque vérification traverse le montage du disque du poste, très lent sous Windows.
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000
opcache.revalidate_freq = 60
realpath_cache_size = 4096K
realpath_cache_ttl = 600
