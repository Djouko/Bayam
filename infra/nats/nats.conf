# Bus d'événements BAYAM (NATS JetStream). Réseau interne « donnees » uniquement (sans accès à Internet).
# Chaque service a son compte et ses droits : seule la passerelle (signatures WAHA et Meta vérifiées) peut écrire
# des événements ; les canaux ne peuvent que les lire et les acquitter. Aucune connexion anonyme.
# En production : 3 nœuds en grappe, TLS entre nœuds.
server_name: bayam-nats-1
port: 4222
http_port: 8222

# Événements WhatsApp jusqu'à 5 Mo (plafond de la passerelle), avec une marge.
max_payload: 8MB

jetstream {
  store_dir: /data
  max_file_store: 20GB
}

authorization {
  users = [
    {
      user: passerelle
      password: $NATS_MDP_PASSERELLE
      permissions: {
        publish: { allow: ["whatsapp.evenements.>", "facebook.evenements.>", "$JS.API.>"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: canal-whatsapp
      password: $NATS_MDP_CANAL_WHATSAPP
      permissions: {
        publish: { allow: ["$JS.API.>", "$JS.ACK.WHATSAPP.>"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
    {
      user: canal-facebook
      password: $NATS_MDP_CANAL_FACEBOOK
      permissions: {
        publish: { allow: ["$JS.API.>", "$JS.ACK.FACEBOOK.>"] }
        subscribe: { allow: ["_INBOX.>"] }
      }
    }
  ]
}
