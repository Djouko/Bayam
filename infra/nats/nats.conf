# Bus d'événements BAYAM (NATS JetStream). Réseau interne uniquement ; en production : 3 nœuds en grappe et
# authentification par service.
server_name: bayam-nats-1
port: 4222
http_port: 8222

# Événements WhatsApp jusqu'à 5 Mo (plafond de la passerelle), avec une marge.
max_payload: 8MB

jetstream {
  store_dir: /data
  max_file_store: 20GB
}
