# Cache des pages pour les visiteurs anonymes, entre l'entrée Traefik et WordPress : une page publique (accueil,
# boutiques, fiches produit) est calculée une fois puis servie 60 s sans faire travailler PHP. Tout ce qui est
# personnel passe sans cache : visiteur connecté ou avec un panier, panier, commande, compte, espace vendeur, API
# (application mobile), liens courts (les clics sont comptés) et liens personnels de commande.

# Copies de WordPress retrouvées par le DNS de Docker (relu toutes les 10 s), charge répartie entre elles.
resolver 127.0.0.11 valid=10s ipv6=off;
upstream wordpress_amont {
    zone wordpress_amont 64k;
    server wordpress:80 resolve;
    keepalive 32;
}

proxy_cache_path /var/cache/nginx/bayam levels=1:2 keys_zone=bayam:20m max_size=512m inactive=10m use_temp_path=off;

map $http_cookie $cookie_personnel {
    default 0;
    ~*(wordpress_logged_in|wp_woocommerce_session|woocommerce_items_in_cart|woocommerce_cart_hash|comment_author|wp-postpass) 1;
}
map $request_uri $adresse_personnelle {
    default 0;
    ~*^/(wp-admin|wp-login\.php|wp-json|xmlrpc\.php|wp-cron\.php|cart|checkout|my-account|store-manager|commander/|b/) 1;
    ~*(add-to-cart|wc-ajax|wc-api|preview=|rest_route|s=) 1;
}
map "$cookie_personnel$adresse_personnelle" $sans_cache {
    default 1;
    00 0;
}

server {
    listen 8080;
    client_max_body_size 32m;

    location ~* ^/(readme\.html|license\.txt|wp-config|wp-content/(plugins|themes)/[^/]+/(composer\.(json|lock)|package(-lock)?\.json|vendor/|tests?/|[^/]*\.md$)) {
        return 404;
    }

    location / {
        proxy_pass http://wordpress_amont;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host; # hôte complet avec le port (localhost:8080), sinon WordPress redirige
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;

        proxy_cache bayam;
        proxy_cache_key $scheme$http_host$request_uri;
        proxy_cache_methods GET HEAD;
        proxy_cache_bypass $sans_cache;
        proxy_no_cache $sans_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 301 302 404 10s;
        # Une page qui dépose un cookie n'est jamais gardée (comportement par défaut, volontairement conservé).
        proxy_ignore_headers Cache-Control Expires;
        # Expirée : la version précédente est servie pendant la mise à jour ; un seul calcul à la fois par page.
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache $upstream_cache_status always;
    }
}
