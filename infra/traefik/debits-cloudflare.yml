# Limites de débit quand le trafic arrive par Cloudflare (tunnel du poste) : adresse réelle du client dans
# Cf-Connecting-Ip, posé par Cloudflare. Seul Cloudflare doit pouvoir joindre l'entrée (sinon en-tête falsifiable).

http:
  middlewares:
    # Navigation ordinaire : une page charge des dizaines de fichiers d'un coup, d'où la rafale permise.
    debit-general:
      rateLimit:
        average: 100
        period: 1s
        burst: 200
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    # Connexion, compte, validation de commande : contre les essais de mots de passe et les commandes en rafale.
    debit-sensible:
      rateLimit:
        average: 10
        period: 1m
        burst: 10
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    # Signalements depuis l'application et le site : quelques-uns par personne, contre le remplissage automatique.
    debit-retours:
      rateLimit:
        average: 6
        period: 1h
        burst: 3
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip

    # Liens personnels de commande : contre l'essai de jetons au hasard.
    debit-liens:
      rateLimit:
        average: 20
        period: 1m
        burst: 10
        sourceCriterion:
          requestHeaderName: Cf-Connecting-Ip
