# Règles communes de l'entrée (en-têtes, tailles, cache), sur le poste comme sur le serveur. Les routes sont dans
# routes.yml ; les limites de débit dans debits-*.yml, selon la façon dont l'adresse du client arrive.

http:
  middlewares:
    securite:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000
        # Le TLS s'arrête chez Cloudflare : Traefik reçoit du HTTP et doit quand même annoncer HSTS.
        forceSTSHeader: true
        contentSecurityPolicy: "frame-ancestors 'self'; base-uri 'self'; object-src 'none'; form-action 'self' https://*.cinetpay.com https://checkout.cinetpay.com"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(self), payment=(self)"
        customResponseHeaders:
          X-Powered-By: ""
          Server: ""
          Cross-Origin-Opener-Policy: same-origin-allow-popups
        # Marque de toute requête venue de l'entrée publique (écrasée si un client l'envoie lui-même) : WordPress
        # refuse ses routes internes à une requête qui la porte, même avec le bon jeton.
        customRequestHeaders:
          X-Bayam-Entree: publique

    # Événements de Meta : 1 Mo au plus (un lot d'événements pèse quelques kilo-octets).
    corps-webhook:
      buffering:
        maxRequestBodyBytes: 1048576
        memRequestBodyBytes: 1048576

    # Petits envois JSON (signalements) : 32 Ko au plus.
    corps-petit:
      buffering:
        maxRequestBodyBytes: 32768
        memRequestBodyBytes: 32768

    # Réponses compressées selon ce que le téléphone accepte (zstd, brotli, gzip) : pages, CSS et JavaScript 3 à 5
    # fois plus légers. Les images et polices, déjà compressées, passent telles quelles.
    compression:
      compress:
        excludedContentTypes:
          - image/jpeg
          - image/png
          - image/webp
          - image/gif
          - image/avif
          - font/woff2
          - video/mp4

    # Fichiers statiques (images, styles, scripts, polices) gardés 7 jours par le téléphone : d'une page à l'autre,
    # rien n'est téléchargé une seconde fois.
    cache-statique:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=604800, stale-while-revalidate=86400"

    # Envois de fichiers (photos d'articles) jusqu'à 32 Mo ; au-delà, refus avant d'atteindre WordPress.
    corps-limite:
      buffering:
        maxRequestBodyBytes: 33554432
        memRequestBodyBytes: 2097152

    # Adresses réservées au réseau interne (API des services, webhook, xmlrpc) : refusées depuis l'entrée.
    interne-seulement:
      ipAllowList:
        sourceRange: ["127.0.0.1/32"]
